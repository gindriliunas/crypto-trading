name: Security Scans

# Gitleaks → Trivy SCA → CodeQL → Checkov+tfsec+Trivy IaC → Trivy image → OWASP ZAP
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  sca:
    name: SCA (Trivy dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: dashboard
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-sca.sarif
      - name: Upload SCA SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-sca.sarif
          category: trivy-sca

  secrets:
    name: Secrets (Gitleaks + Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"
          format: table
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    name: IaC (Trivy + Checkov + tfsec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy misconfig (Azure Terraform)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: azure
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table
          trivyignores: azure/.trivyignore
      - name: Trivy IaC SARIF (report only)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: azure
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "0"
          format: sarif
          output: trivy-iac.sarif
          trivyignores: azure/.trivyignore
      - name: Upload Trivy IaC SARIF
        if: always() && hashFiles('trivy-iac.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: azure
          framework: terraform
          soft_fail: false
          config_file: azure/.checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
      - name: Upload Checkov SARIF
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
          category: checkov
      - name: tfsec
        uses: aquasecurity/tfsec-sarif-action@v0.1.4
        with:
          working_directory: azure
          sarif_file: ../tfsec.sarif
      - name: Upload tfsec SARIF
        if: always() && hashFiles('tfsec.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec.sarif
          category: tfsec

  container:
    name: Container (Trivy image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build dashboard image (local tag)
        uses: docker/build-push-action@v6
        with:
          context: dashboard
          file: dashboard/Dockerfile
          push: false
          load: true
          tags: crypto-trading-dashboard:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: crypto-trading-dashboard:scan
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-image.sarif
      - name: Upload image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    # Soft on PR/push (URL may be stale mid-deploy). Blocking DAST runs after Azure Deploy to dev.
    # Hard gate on workflow_dispatch for ad-hoc Security Scans runs.
    continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
    steps:
      - name: ZAP baseline against live dev
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "https://dev.gindri.com"
          fail_action: true
          allow_issue_writing: false
          cmd_options: "-a"

  summary:
    name: Security gate summary
    runs-on: ubuntu-latest
    if: always()
    needs: [sast, sca, secrets, terraform, container, dast]
    steps:
      - name: Recruiter-readable gate report
        run: |
          echo "## DevSecOps security gates" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Layer | Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| SAST | CodeQL | ${{ needs.sast.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SCA | Trivy fs | ${{ needs.sca.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secrets | Gitleaks + Trivy | ${{ needs.secrets.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| IaC | Trivy + Checkov + tfsec | ${{ needs.terraform.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Container | Trivy image | ${{ needs.container.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| DAST | OWASP ZAP | ${{ needs.dast.result }} |" >> "$GITHUB_STEP_SUMMARY"
          for r in "${{ needs.sast.result }}" "${{ needs.sca.result }}" "${{ needs.secrets.result }}" "${{ needs.terraform.result }}" "${{ needs.container.result }}"; do
            if [ "$r" != "success" ]; then
              echo "Blocking gate failed: $r"
              exit 1
            fi
          done
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ needs.dast.result }}" != "success" ]; then
            echo "DAST failed on manual Security Scans run"
            exit 1
          fi
          echo "Note: blocking DAST after deploy is job 'DAST after deploy (OWASP ZAP)' in Azure Deploy."
