name: AWS Destroy (legacy)

# Manual only — tears down the old AWS stack after Azure cutover.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  destroy:
    name: Terraform Destroy AWS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2
      - name: Destroy staging
        continue-on-error: true
        run: |
          terraform init -reconfigure -backend-config=backends/staging.hcl
          terraform destroy -input=false -auto-approve -var-file=envs/staging.tfvars
      - name: Destroy production
        continue-on-error: true
        run: |
          terraform init -reconfigure -backend-config=backends/production.hcl
          terraform destroy -input=false -auto-approve -var-file=envs/production.tfvars
      - name: Destroy dev
        run: |
          terraform init -reconfigure -backend-config=backends/dev.hcl
          terraform destroy -input=false -auto-approve -var-file=envs/dev.tfvars
