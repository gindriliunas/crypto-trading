name: Azure Deploy

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, staging, production]
  # Dev deploy starts only after Security Scans finishes. A failed scan fails this workflow.
  workflow_run:
    workflows: ["Security Scans"]
    types: [completed]
    branches: [main]

# OIDC federated credentials (no ARM_CLIENT_SECRET).
# Entra app → Federated credentials → GitHub Actions → Environment = job environment name.
permissions:
  contents: read
  id-token: write
  actions: read

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_USE_OIDC: true
  ARM_USE_CLI: false

jobs:
  plan:
    name: Terraform Plan (Azure)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: azure
    steps:
      - name: Skip Azure plan for Dependabot
        if: github.actor == 'dependabot[bot]'
        # Job default is azure/, but checkout is skipped for Dependabot — run from workspace root.
        working-directory: ${{ github.workspace }}
        run: |
          echo "Dependabot PRs cannot use OIDC or read Actions secrets."
          echo "Azure terraform plan is skipped here; Security Scans still gate the PR."
      - uses: actions/checkout@v4
        if: github.actor != 'dependabot[bot]'
      - name: Require ARM OIDC IDs
        if: github.actor != 'dependabot[bot]'
        run: |
          missing=0
          for v in ARM_CLIENT_ID ARM_SUBSCRIPTION_ID ARM_TENANT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty — add it under Settings → Secrets and variables → Actions (repository secrets)."
              echo "::error::Do not create empty Environment secrets with the same names (they override repo secrets)."
              echo "::error::Also add an Entra federated credential for repo:ORG/REPO:environment:dev"
              missing=1
            fi
          done
          exit $missing
      - uses: azure/login@v2
        if: github.actor != 'dependabot[bot]'
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        if: github.actor != 'dependabot[bot]'
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - if: github.actor != 'dependabot[bot]'
        run: terraform init -reconfigure -backend-config=backends/dev.hcl
      - if: github.actor != 'dependabot[bot]'
        run: terraform plan -input=false -lock-timeout=5m -var-file=envs/dev.tfvars

  security-gate:
    name: Security scans gate
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Block deploy when Security Scans did not pass
        run: |
          set -euo pipefail
          conclusion="${{ github.event.workflow_run.conclusion }}"
          event="${{ github.event.workflow_run.event }}"
          branch="${{ github.event.workflow_run.head_branch }}"
          sha="${{ github.event.workflow_run.head_sha }}"
          url="${{ github.event.workflow_run.html_url }}"
          echo "Security Scans event=$event branch=$branch conclusion=$conclusion sha=$sha"
          echo "Run: $url"
          if [ "$event" != "push" ] || [ "$branch" != "main" ]; then
            echo "Not a push to main. Dev deploy will not start."
            exit 0
          fi
          if [ "$conclusion" != "success" ]; then
            echo "::error::Security Scans concluded $conclusion for $sha. Dev deploy is blocked."
            exit 1
          fi
          echo "Security Scans passed. Dev deploy may start."

  deploy-dev:
    name: Deploy Azure Dev
    needs: security-gate
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: azure
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Require ARM OIDC IDs
        run: |
          missing=0
          for v in ARM_CLIENT_ID ARM_SUBSCRIPTION_ID ARM_TENANT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty — add it under Settings → Secrets and variables → Actions (and/or Environment 'dev')"
              echo "::error::Entra federated credential subject must be repo:ORG/REPO:environment:dev"
              missing=1
            fi
          done
          exit $missing
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Terraform init
        run: terraform init -reconfigure -backend-config=backends/dev.hcl
      - name: Create registry and database first
        run: |
          terraform apply -input=false -lock-timeout=5m -auto-approve -var-file=envs/dev.tfvars \
            -target=azurerm_resource_group.app \
            -target=azurerm_container_registry.app \
            -target=random_password.db \
            -target=random_password.jwt \
            -target=random_password.signup_invite \
            -target=azurerm_postgresql_flexible_server.app \
            -target=azurerm_postgresql_flexible_server_database.app \
            -target=azurerm_postgresql_flexible_server_firewall_rule.allow_azure \
            -target=azurerm_log_analytics_workspace.app \
            -target=azurerm_container_app_environment.app
      - name: Login to ACR
        id: acr
        run: |
          ACR=$(terraform output -raw acr_login_server)
          USER=$(terraform output -raw acr_username)
          PASS=$(terraform output -raw acr_password)
          echo "$PASS" | docker login "$ACR" -u "$USER" --password-stdin
          echo "login_server=$ACR" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: |
          ACR="${{ steps.acr.outputs.login_server }}"
          docker build -t "$ACR/crypto-trading-dev:${{ github.event.workflow_run.head_sha }}" -t "$ACR/crypto-trading-dev:latest" ../dashboard
      - name: Container image scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.acr.outputs.login_server }}/crypto-trading-dev:${{ github.event.workflow_run.head_sha }}
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Push image
        run: |
          ACR="${{ steps.acr.outputs.login_server }}"
          docker push "$ACR/crypto-trading-dev:${{ github.event.workflow_run.head_sha }}"
          docker push "$ACR/crypto-trading-dev:latest"
      - name: Deploy Container App
        run: terraform apply -input=false -lock-timeout=5m -auto-approve -var-file=envs/dev.tfvars -var="app_image_tag=${{ github.event.workflow_run.head_sha }}"
      - name: Dashboard URL
        run: terraform output dashboard_url

  dast-dev:
    name: DAST after deploy (OWASP ZAP)
    needs: deploy-dev
    if: needs.deploy-dev.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Wait for /api/health
        run: |
          set -e
          for i in $(seq 1 36); do
            if curl -fsS "https://dev.gindri.com/api/health" | grep -q '"ok"'; then
              echo "Healthy after attempt $i"
              exit 0
            fi
            echo "Waiting for app ($i/36)..."
            sleep 10
          done
          echo "dev.gindri.com did not become healthy in time"
          exit 1
      - name: OWASP ZAP baseline against live dev
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "https://dev.gindri.com"
          fail_action: true
          allow_issue_writing: false
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"

  deploy-manual:
    name: Deploy Azure ${{ inputs.environment }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: azure
    steps:
      - name: Block deploy unless Security Scans succeeded
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          repo="${{ github.repository }}"
          echo "Requiring a successful Security Scans run for $sha"
          for i in $(seq 1 60); do
            json=$(gh api "/repos/${repo}/actions/workflows/Security%20Scans.yml/runs?head_sha=${sha}&per_page=5")
            status=$(printf '%s' "$json" | jq -r '.workflow_runs[0].status // ""')
            conclusion=$(printf '%s' "$json" | jq -r '.workflow_runs[0].conclusion // ""')
            url=$(printf '%s' "$json" | jq -r '.workflow_runs[0].html_url // ""')
            if [ -z "$status" ]; then
              echo "No Security Scans run for this commit yet ($i/60)."
              sleep 30
              continue
            fi
            echo "Latest Security Scans status=$status conclusion=$conclusion $url"
            if [ "$status" != "completed" ]; then
              echo "Waiting for Security Scans ($i/60)..."
              sleep 30
              continue
            fi
            if [ "$conclusion" = "success" ]; then
              echo "Security Scans passed."
              exit 0
            fi
            echo "::error::Security Scans concluded $conclusion for $sha. Deploy is blocked. $url"
            exit 1
          done
          echo "::error::No successful Security Scans run for $sha. Deploy is blocked."
          exit 1
      - uses: actions/checkout@v4
      - name: Require ARM OIDC IDs
        run: |
          missing=0
          for v in ARM_CLIENT_ID ARM_SUBSCRIPTION_ID ARM_TENANT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty — add it under Settings → Secrets (repo or Environment '${{ inputs.environment }}')"
              echo "::error::Entra federated credential subject must be repo:ORG/REPO:environment:${{ inputs.environment }}"
              missing=1
            fi
          done
          exit $missing
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - run: terraform init -reconfigure -backend-config=backends/${{ inputs.environment }}.hcl
      - run: |
          terraform apply -input=false -lock-timeout=5m -auto-approve -var-file=envs/${{ inputs.environment }}.tfvars \
            -target=azurerm_resource_group.app \
            -target=azurerm_container_registry.app \
            -target=random_password.db \
            -target=random_password.jwt \
            -target=random_password.signup_invite \
            -target=azurerm_postgresql_flexible_server.app \
            -target=azurerm_postgresql_flexible_server_database.app \
            -target=azurerm_postgresql_flexible_server_firewall_rule.allow_azure \
            -target=azurerm_log_analytics_workspace.app \
            -target=azurerm_container_app_environment.app
      - name: Login to ACR
        id: acr
        run: |
          ACR=$(terraform output -raw acr_login_server)
          USER=$(terraform output -raw acr_username)
          PASS=$(terraform output -raw acr_password)
          echo "$PASS" | docker login "$ACR" -u "$USER" --password-stdin
          echo "login_server=$ACR" >> "$GITHUB_OUTPUT"
          echo "image_name=crypto-trading-${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: |
          ACR="${{ steps.acr.outputs.login_server }}"
          NAME="${{ steps.acr.outputs.image_name }}"
          docker build -t "$ACR/$NAME:${{ github.sha }}" -t "$ACR/$NAME:latest" ../dashboard
      - name: Container image scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.acr.outputs.login_server }}/${{ steps.acr.outputs.image_name }}:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Push image
        run: |
          ACR="${{ steps.acr.outputs.login_server }}"
          NAME="${{ steps.acr.outputs.image_name }}"
          docker push "$ACR/$NAME:${{ github.sha }}"
          docker push "$ACR/$NAME:latest"
      - run: terraform apply -input=false -lock-timeout=5m -auto-approve -var-file=envs/${{ inputs.environment }}.tfvars -var="app_image_tag=${{ github.sha }}"
      - run: terraform output dashboard_url

  dast-manual-dev:
    name: DAST after manual deploy (OWASP ZAP)
    needs: deploy-manual
    if: needs.deploy-manual.result == 'success' && inputs.environment == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for /api/health
        run: |
          set -e
          for i in $(seq 1 36); do
            if curl -fsS "https://dev.gindri.com/api/health" | grep -q '"ok"'; then
              echo "Healthy after attempt $i"
              exit 0
            fi
            echo "Waiting for app ($i/36)..."
            sleep 10
          done
          echo "dev.gindri.com did not become healthy in time"
          exit 1
      - name: OWASP ZAP baseline against live dev
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "https://dev.gindri.com"
          fail_action: true
          allow_issue_writing: false
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"
