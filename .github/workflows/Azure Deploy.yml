name: Azure Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, staging, production]

permissions:
  contents: read

# Service principal auth for Terraform + azurerm backend (use_azuread_auth).
# Must be non-empty repo (or Environment) secrets — empty values make Terraform fall back to `az login`.
env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_USE_CLI: false

jobs:
  plan:
    name: Terraform Plan (Azure)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: azure
    steps:
      - uses: actions/checkout@v4
      - name: Require ARM secrets
        run: |
          missing=0
          for v in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_SUBSCRIPTION_ID ARM_TENANT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty — add it under Settings → Secrets (repo or Environment 'dev')"
              missing=1
            fi
          done
          exit $missing
      - uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - run: terraform init -reconfigure -backend-config=backends/dev.hcl
      - run: terraform plan -input=false -var-file=envs/dev.tfvars

  deploy-dev:
    name: Deploy Azure Dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: azure
    steps:
      - uses: actions/checkout@v4
      - name: Require ARM secrets
        run: |
          missing=0
          for v in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_SUBSCRIPTION_ID ARM_TENANT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty — add it under Settings → Secrets and variables → Actions (and/or Environment 'dev')"
              missing=1
            fi
          done
          exit $missing
      - uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Terraform init
        run: terraform init -reconfigure -backend-config=backends/dev.hcl
      - name: Create registry and database first
        run: |
          terraform apply -input=false -auto-approve -var-file=envs/dev.tfvars \
            -target=azurerm_resource_group.app \
            -target=azurerm_container_registry.app \
            -target=random_password.db \
            -target=random_password.jwt \
            -target=random_password.signup_invite \
            -target=azurerm_postgresql_flexible_server.app \
            -target=azurerm_postgresql_flexible_server_database.app \
            -target=azurerm_postgresql_flexible_server_firewall_rule.allow_azure \
            -target=azurerm_log_analytics_workspace.app \
            -target=azurerm_container_app_environment.app
      - name: Login to ACR
        id: acr
        run: |
          ACR=$(terraform output -raw acr_login_server)
          USER=$(terraform output -raw acr_username)
          PASS=$(terraform output -raw acr_password)
          echo "$PASS" | docker login "$ACR" -u "$USER" --password-stdin
          echo "login_server=$ACR" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: |
          ACR="${{ steps.acr.outputs.login_server }}"
          docker build -t "$ACR/crypto-trading-dev:${{ github.sha }}" -t "$ACR/crypto-trading-dev:latest" ../dashboard
      - name: Container image scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.acr.outputs.login_server }}/crypto-trading-dev:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Push image
        run: |
          ACR="${{ steps.acr.outputs.login_server }}"
          docker push "$ACR/crypto-trading-dev:${{ github.sha }}"
          docker push "$ACR/crypto-trading-dev:latest"
      - name: Deploy Container App
        run: terraform apply -input=false -auto-approve -var-file=envs/dev.tfvars -var="app_image_tag=${{ github.sha }}"
      - name: Dashboard URL
        run: terraform output dashboard_url

  dast-dev:
    name: DAST after deploy (OWASP ZAP)
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for /api/health
        run: |
          set -e
          for i in $(seq 1 36); do
            if curl -fsS "https://dev.gindri.com/api/health" | grep -q '"ok"'; then
              echo "Healthy after attempt $i"
              exit 0
            fi
            echo "Waiting for app ($i/36)..."
            sleep 10
          done
          echo "dev.gindri.com did not become healthy in time"
          exit 1
      - name: OWASP ZAP baseline against live dev
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "https://dev.gindri.com"
          fail_action: true
          allow_issue_writing: false
          cmd_options: "-a"

  deploy-manual:
    name: Deploy Azure ${{ inputs.environment }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: azure
    steps:
      - uses: actions/checkout@v4
      - name: Require ARM secrets
        run: |
          missing=0
          for v in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_SUBSCRIPTION_ID ARM_TENANT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty — add it under Settings → Secrets (repo or Environment '${{ inputs.environment }}')"
              missing=1
            fi
          done
          exit $missing
      - uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - run: terraform init -reconfigure -backend-config=backends/${{ inputs.environment }}.hcl
      - run: |
          terraform apply -input=false -auto-approve -var-file=envs/${{ inputs.environment }}.tfvars \
            -target=azurerm_resource_group.app \
            -target=azurerm_container_registry.app \
            -target=random_password.db \
            -target=random_password.jwt \
            -target=random_password.signup_invite \
            -target=azurerm_postgresql_flexible_server.app \
            -target=azurerm_postgresql_flexible_server_database.app \
            -target=azurerm_postgresql_flexible_server_firewall_rule.allow_azure \
            -target=azurerm_log_analytics_workspace.app \
            -target=azurerm_container_app_environment.app
      - name: Login to ACR
        id: acr
        run: |
          ACR=$(terraform output -raw acr_login_server)
          USER=$(terraform output -raw acr_username)
          PASS=$(terraform output -raw acr_password)
          echo "$PASS" | docker login "$ACR" -u "$USER" --password-stdin
          echo "login_server=$ACR" >> "$GITHUB_OUTPUT"
          echo "image_name=crypto-trading-${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: |
          ACR="${{ steps.acr.outputs.login_server }}"
          NAME="${{ steps.acr.outputs.image_name }}"
          docker build -t "$ACR/$NAME:${{ github.sha }}" -t "$ACR/$NAME:latest" ../dashboard
      - name: Container image scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.acr.outputs.login_server }}/${{ steps.acr.outputs.image_name }}:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Push image
        run: |
          ACR="${{ steps.acr.outputs.login_server }}"
          NAME="${{ steps.acr.outputs.image_name }}"
          docker push "$ACR/$NAME:${{ github.sha }}"
          docker push "$ACR/$NAME:latest"
      - run: terraform apply -input=false -auto-approve -var-file=envs/${{ inputs.environment }}.tfvars -var="app_image_tag=${{ github.sha }}"
      - run: terraform output dashboard_url

  dast-manual-dev:
    name: DAST after manual deploy (OWASP ZAP)
    needs: deploy-manual
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for /api/health
        run: |
          set -e
          for i in $(seq 1 36); do
            if curl -fsS "https://dev.gindri.com/api/health" | grep -q '"ok"'; then
              echo "Healthy after attempt $i"
              exit 0
            fi
            echo "Waiting for app ($i/36)..."
            sleep 10
          done
          echo "dev.gindri.com did not become healthy in time"
          exit 1
      - name: OWASP ZAP baseline against live dev
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "https://dev.gindri.com"
          fail_action: true
          allow_issue_writing: false
          cmd_options: "-a"
